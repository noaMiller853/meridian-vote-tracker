# Local stack: `docker compose up --build` starts PostgreSQL, the API and the web client.
# `web` is the Angular client (nginx) on http://localhost:4200; it proxies /api to the API.
services:
  api:
    build:
      context: .
      dockerfile: src/Meridian.Api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development   # Swagger and the OpenAPI document are served only in Development
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-meridian};Username=${POSTGRES_USER:-meridian};Password=${POSTGRES_PASSWORD:-meridian_dev}
      Database__MigrateOnStartup: "true"
      Seed__MemberStatesPath: /app/seed/member_states.csv
      FileStore__LocalRoot: /data/uploads
      # Application Insights: on only when .env (git-ignored) sets it; empty means off. Never put the value in this file.
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
    volumes:
      - meridian-uploads:/data/uploads
    ports:
      - "5284:8080"

  web:
    build: src/web
    depends_on: [api]
    ports:
      - "4200:80"

  # Optional MCP server (lets Claude use the API): docker compose --profile mcp up --build
  mcp:
    profiles: ["mcp"]
    build:
      context: .
      dockerfile: src/Meridian.Mcp/Dockerfile
    depends_on: [api]
    environment:
      Meridian__ApiUrl: http://api:8080
      Meridian__UserName: Dana
      Mcp__ApiKey: ${MCP_API_KEY:-}   # required when this profile is used: a random value of 24+ characters
    ports:
      - "8090:8080"

  db:
    image: postgres:17
    container_name: meridian-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meridian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meridian_dev}   # local development only
      POSTGRES_DB: ${POSTGRES_DB:-meridian}
    ports:
      # Local machine only: the default password is for development.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - meridian-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meridian} -d ${POSTGRES_DB:-meridian}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  meridian-db-data:
  meridian-uploads:

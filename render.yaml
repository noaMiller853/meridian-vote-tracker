# Render Blueprint: New + > Blueprint > pick this repository. Creates the database and three services in one region.
# Secrets are generated by Render (see the "meridian-secrets" group in the dashboard, Environment > Linked groups), never stored here.
#
#   meridian-web  public   the Angular client; nginx forwards /api to meridian-api (API_UPSTREAM, you enter it when applying)
#   meridian-api  public   the API (Jwt sign-in; Swagger is off in Production)
#   meridian-mcp  public   the MCP server for Claude, protected by the generated Mcp__ApiKey; it signs in to the API as Dana
#
# Free plans sleep after about 15 minutes without traffic, the free database expires after 30 days and there is no
# persistent disk: uploaded files are lost on every deploy or restart (reports and history stay in the database).
databases:
  - name: meridian-db
    plan: free
    region: frankfurt
    databaseName: meridian
    user: meridian
    postgresMajorVersion: "17"

envVarGroups:
  - name: meridian-secrets
    envVars:
      - key: Auth__JwtKey
        generateValue: true
      - key: Auth__Passwords__Dana
        generateValue: true
      - key: Auth__Passwords__Omar
        generateValue: true
      - key: Auth__Passwords__Lena
        generateValue: true

services:
  - type: web
    name: meridian-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./src/Meridian.Api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - fromGroup: meridian-secrets
      - key: PORT
        value: "8080"
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Auth__Mode
        value: Jwt
      - key: Database__MigrateOnStartup
        value: "true"
      - key: Seed__MemberStatesPath
        value: /app/seed/member_states.csv
      - key: FileStore__LocalRoot
        value: /data/uploads
      - key: ConnectionStrings__Default
        fromDatabase:
          name: meridian-db
          property: connectionString

  - type: web
    name: meridian-web
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./src/web/Dockerfile
    dockerContext: ./src/web
    envVars:
      # The public address of meridian-api (https://meridian-api-xxxx.onrender.com, shown on its page). A free web service
      # cannot receive private-network traffic, so the free plan has to use the public address. On a paid plan use the
      # internal address from the API's Connect menu instead (http://<internal host>:8080).
      - key: API_UPSTREAM
        sync: false

  - type: web
    name: meridian-mcp
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./src/Meridian.Mcp/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - fromGroup: meridian-secrets
      - key: PORT
        value: "8080"
      # Same address as API_UPSTREAM above (the public one on the free plan).
      - key: Meridian__ApiUrl
        sync: false
      - key: Meridian__UserName
        value: Dana
      - key: Mcp__ApiKey
        generateValue: true

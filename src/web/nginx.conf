# Template: the nginx image fills ${PORT} and ${API_UPSTREAM} from the environment at start.
# Local compose uses the defaults from the Dockerfile; on Render both come from the service settings.
server {
  listen ${PORT};

  # Headers for every response. No CSP here: Angular's build writes inline styles and a script that a strict CSP would block.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  # Uploads go through here: the historic file is about 100 MB, the API accepts up to 250 MB.
  client_max_body_size 250m;

  # The browser talks to one address; the API is behind it, so no CORS is needed.
  location /api/ {
    proxy_pass ${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /health { proxy_pass ${API_UPSTREAM}; }
  location /swagger { proxy_pass ${API_UPSTREAM}; }
  location /openapi/ { proxy_pass ${API_UPSTREAM}; }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Uploads go through here: the historic file is about 100 MB, the API accepts up to 250 MB.
  client_max_body_size 250m;

  # The browser talks to one address; the API is behind it, so no CORS is needed.
  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /health { proxy_pass http://api:8080; }
  location /swagger { proxy_pass http://api:8080; }
  location /openapi/ { proxy_pass http://api:8080; }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
